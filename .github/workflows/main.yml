name: Deploy VoicePress Frontend

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest # FIXED: Correct indentation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Backend URL
        env:
          ACTUAL_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          # Use a fuzzy regex to catch placeholders even with quote mismatches
          echo "Injecting Backend URL..."
          sed -i "s|__BACKEND_URL__|${{ env.ACTUAL_URL }}|g" index.html
          sed -i "s|__BACKEND_URL__|${{ env.ACTUAL_URL }}|g" upload.js
          
          # DEBUG: Verify the replacement happened in the logs
          echo "Verifying index.html change:"
          grep "API_URL" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
